apiVersion: v1
kind: Service
metadata:
  name: {{ Values.name }}
  labels:
    app: {{ Values.app }}
    chart: {{ Values.chart }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ Values.app }}
    release: {{ .Release.Name }}
